metadata_task:
  description: >
    Find the training data of "{model_id}" using its metadata, its model card and its paper.
    Find the paper with fetch_paper_local (or fetch_paper_api if none is linked),
    then read it with retrieve_paper_from_arxiv.
    If a source says the model reuses another model's training data (e.g. "phi-1's training data"),
    find that model's paper and read it too. List the actual datasets, not the reference.
  expected_output: >
    A list of the named training datasets. For each one, the sentence it came from
    and the arXiv id of the paper.
