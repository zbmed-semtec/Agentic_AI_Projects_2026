answer_question:
  description: >
    Answer this question about the model cards: {question}
    Use your tools to find the relevant cards. As soon as the tool results
    answer the question, stop and answer.
    Base your answer only on what the cards say.
  expected_output: >
    Exactly ONE of these two formats, never both:
    (A) If the cards answer the question: a short answer of 2-4 sentences,
    or a short list with one line per model if several models match.
    End with a last line "Source: <filename(s)>" listing every card file you used.
    (B) If no card answers the question: only the sentence
    "I could not find relevant cards for this question."
  agent: card_guide

suggest_questions:
  description: >
    Suggest follow-up questions based on the previous answer.
    The user's original question was: "{question}"
    Do not repeat that question. Stay on its topic.
    First call list_cards to see which models, licenses and tasks exist.
    Only suggest questions the model cards can answer.
    If the previous answer is "I could not find relevant cards for this question.",
    suggest questions about models that are in the collection instead.
  expected_output: >
    Exactly 3 follow-up questions as a numbered list (1. 2. 3.),
    one question per line. No headline and no other text.
  agent: suggestion_helper
  context:
    - answer_question